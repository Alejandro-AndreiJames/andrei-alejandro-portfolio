<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      ;(() => {
        const savedTheme = localStorage.getItem('theme')
        const prefersDark = window.matchMedia(
          '(prefers-color-scheme: dark)',
        ).matches
        const theme =
          savedTheme === 'light' || savedTheme === 'dark'
            ? savedTheme
            : prefersDark
              ? 'dark'
              : 'light'

        document.documentElement.classList.toggle('dark', theme === 'dark')
        document.documentElement.style.colorScheme = theme
      })()
    </script>
    <meta
      name="description"
      content="Portfolio of Andrei James Alejandro, a software developer building accessible web and mobile applications."
    />
    <meta name="author" content="Andrei James Alejandro" />
    <meta name="theme-color" content="#071012" />

    <meta
      property="og:title"
      content="Andrei James Alejandro | Software Developer"
    />
    <meta
      property="og:description"
      content="Explore my software development experience, skills, and selected projects."
    />
    <meta property="og:type" content="website" />

    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />

    <title>Andrei James Alejandro | Software Developer</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
